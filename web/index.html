<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caddy Dashboard</title>
<script src="theme-init.js"></script>
<style>
  :root {
    --bg: #f5f4f0;
    --panel: #ffffff;
    --border: #dcdad3;
    --text: #1c1d1f;
    --muted: #6b7078;
    --accent: #2b8a5e;
    --accent-hover: #237249;
    --danger: #e5534b;
    --input-bg: #ffffff;
    --mono: 'SF Mono', Consolas, 'Courier New', monospace;
  }
  html[data-theme="dark"] {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --input-bg: #0f1115;
  }
  @media (prefers-color-scheme: dark) {
    html[data-theme="system"] {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #2a2f3a;
      --text: #e6e8eb;
      --muted: #8b93a1;
      --input-bg: #0f1115;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .icon-select { display: inline-flex; align-items: center; gap: 6px; }
  .icon-select svg { width: 15px; height: 15px; color: var(--muted); flex-shrink: 0; }
  .icon-select select {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 8px;
    cursor: pointer;
    font-family: inherit;
  }
  #login-screen {
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #login-screen .login-content {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  #login-screen .top-controls { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; align-items: center; }
  .login-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    width: 320px;
  }
  .login-box h1 { font-size: 18px; margin: 0 0 20px; }
  input[type=password], input[type=text] {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
  }
  button {
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: white;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .error-msg { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 16px; }

  #app { display: none; height: 100vh; flex-direction: column; }
  header {
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 16px; margin: 0; }

  main { flex: 1; display: flex; overflow: hidden; }
  nav {
    width: 200px;
    border-right: 1px solid var(--border);
    padding: 16px 0;
  }
  nav button.tab {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    color: var(--muted);
    border-radius: 0;
    padding: 10px 20px;
    font-weight: 500;
  }
  nav button.tab.active { color: var(--text); background: var(--panel); border-left: 2px solid var(--accent); }

  .content { flex: 1; overflow-y: auto; padding: 24px; }
  .system-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    max-width: 480px;
  }
  .system-card dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; }
  .system-card dt { color: var(--muted); font-size: 12px; }
  .system-card dd { margin: 0; font-family: var(--mono); font-size: 13px; }
  .empty-state { color: var(--muted); padding: 40px; text-align: center; }

  .app-footer {
    padding: 8px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-shrink: 0;
  }
  .app-footer a { color: var(--muted); font-size: 12px; text-decoration: none; }
  .app-footer a:hover { color: var(--accent); }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-content">
    <div class="top-controls">
      <div class="theme-switch icon-select" id="theme-switch-login"></div>
    </div>
    <div class="login-box">
      <h1>Caddy Dashboard</h1>
      <input type="text" id="username-input" placeholder="Login" autocomplete="username" autofocus>
      <div style="height:8px;"></div>
      <input type="password" id="password-input" placeholder="Haslo" autocomplete="current-password">
      <div class="error-msg" id="login-error"></div>
      <button id="login-btn" style="width:100%;margin-top:10px;">Zaloguj</button>
    </div>
  </div>
</div>

<div id="app">
  <header>
    <h1>Caddy Dashboard</h1>
    <div style="display:flex;align-items:center;gap:12px;">
      <span id="current-user" style="font-size:12px;color:var(--muted);font-family:var(--mono);"></span>
      <div class="theme-switch icon-select" id="theme-switch-app"></div>
      <button class="secondary" id="logout-btn">Wyloguj</button>
    </div>
  </header>
  <main>
    <nav>
      <button class="tab active" data-tab="system">System</button>
    </nav>
    <div class="content" id="content"></div>
  </main>
  <footer class="app-footer">
    <a href="https://automation-ai.eu/" target="_blank" rel="noopener noreferrer">automation-ai.eu</a>
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
