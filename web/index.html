<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="theme-init.js?v=1.40.9"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login-screen">
  <div class="login-content">
    <div class="top-controls">
      <div class="lang-switch" id="lang-switch-login"></div>
      <div class="theme-switch" id="theme-switch-login"></div>
    </div>
    <div class="login-box">
      <h1>Caddy Dashboard <span class="app-version" id="app-version-login"></span></h1>
      <input type="text" id="username-input" data-i18n-placeholder="login.username_placeholder" autocomplete="username" autofocus>
      <div style="height:8px;"></div>
      <input type="password" id="password-input" data-i18n-placeholder="login.password_placeholder" autocomplete="current-password">
      <div id="turnstile-container" style="margin-top:10px;display:none;"></div>
      <div class="error-msg" id="login-error"></div>
      <button id="login-btn" style="width:100%;margin-top:10px;" data-i18n="login.button"></button>
    </div>
  </div>
</div>

<div id="app">
  <header>
    <div style="display:flex;align-items:center;gap:10px;">
      <svg width="28" height="28" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="flex:none;">
        <defs><linearGradient id="cdIconGrad" x1="0" y1="0" x2="32" y2="32"><stop offset="0" stop-color="#12a594"/><stop offset="1" stop-color="#155e75"/></linearGradient></defs>
        <rect width="32" height="32" rx="8" fill="url(#cdIconGrad)"/>
        <text x="16" y="23" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20" fill="#ffffff">C</text>
      </svg>
      <h1>Caddy Dashboard <span class="app-version" id="app-version-header"></span></h1>
      <button type="button" class="update-badge" id="update-badge" style="display:none;"></button>
      <span id="update-restart-hint" style="display:none;color:var(--danger);font-size:12px;font-family:var(--mono);"></span>
    </div>
    <div style="display:flex;align-items:center;gap:16px;">
      <span id="current-user" style="font-size:12px;color:var(--muted);font-family:var(--mono);"></span>
      <div class="lang-switch" id="lang-switch-app"></div>
      <div class="theme-switch" id="theme-switch-app"></div>
      <button class="secondary" id="logout-btn" data-i18n="header.logout"></button>
    </div>
  </header>
  <main>
    <nav>
      <div class="nav-section-label" id="nav-main-label" data-i18n="nav.main_section"></div>
      <button class="tab active" data-tab="system"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg><span data-i18n="nav.system"></span></button>
      <button class="tab" data-tab="packages"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg><span data-i18n="nav.packages"></span></button>
      <button class="tab" data-tab="accounts"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span data-i18n="nav.accounts"></span></button>
      <button class="tab" data-tab="mail"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/></svg><span data-i18n="nav.mail"></span></button>
      <button class="tab" data-tab="services"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg><span data-i18n="nav.services"></span></button>
      <button class="tab" data-tab="ssh"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></svg><span data-i18n="nav.ssh"></span></button>
      <button class="tab" data-tab="firewall"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 5-3.5 8-7 9-3.5-1-7-4-7-9V6l7-3z"/></svg><span data-i18n="nav.firewall"></span></button>
      <button class="tab" data-tab="cron"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg><span data-i18n="nav.cron"></span></button>
      <button class="tab" data-tab="runtime-manager"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/></svg><span data-i18n="nav.runtime-manager"></span></button>
      <button class="tab" data-tab="caddy"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg><span data-i18n="nav.caddy"></span></button>
      <div id="nav-installed-extra"></div>
      <div class="nav-separator" id="nav-install-separator" style="display:none;"></div>
      <div class="nav-section-label" id="nav-install-label" data-i18n="nav.install_section" style="display:none;"></div>
      <div id="nav-install-list"></div>
    </nav>
    <div class="content" id="content"></div>
  </main>
  <footer class="app-footer">
    <span class="footer-clock" id="footer-clock"></span>
  </footer>
</div>

<script src="i18n.js?v=1.40.9"></script>
<script src="app.js?v=1.40.9"></script>
</body>
</html>
